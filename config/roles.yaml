      - wa_agent.draft
      - wa_agent.audit.read
      - contributor.read
  messaging-agent-qa:
    description: "Messaging/WA Agent QA and respawn checklist worker"
    permissions:
      - wa_agent.read
      - wa_agent.draft
      - contributor.read
