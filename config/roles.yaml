    permissions:
      - wa_agent.read
      - wa_agent.draft
      - contributor.read
  wa-agent-support:
    description: "Backward-compatible alias for messaging-agent-support"
    permissions:
      - wa_agent.read
      - wa_agent.audit.read
      - contributor.read
  instagrow-conductor:
    description: "Maestro / InstaGrow orchestration"
    permissions:
      - instagrow.read
      - instagrow.draft
      - contributor.read
  instagrow-research:
    description: "Scout"
    permissions:
      - instagrow.read
      - instagrow.draft
  instagrow-content:
    description: "Quill"
    permissions:
      - instagrow.read
      - instagrow.draft
  instagrow-creative:
    description: "Pixel"
    permissions:
      - instagrow.read
      - instagrow.draft
  instagrow-publishing:
    description: "Dispatch"
    permissions:
      - instagrow.read
